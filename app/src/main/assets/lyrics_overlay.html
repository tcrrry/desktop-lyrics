<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>桌面歌词</title>
  <style>
    :root {
      --c1: 255, 91, 87;
      --c2: 113, 66, 255;
      --c3: 255, 173, 71;
      --c4: 25, 171, 210;
      --lyric-font-size:28px;
      --lyric-active-size:34px;
      --compact-font-size:30px;
      --compact-next-size:23px;
      --lyric-line-padding:12px;
      --lyric-rgb:255,255,255;
      --muted: rgba(255,255,255,.62);
      --soft: rgba(255,255,255,.38);
    }
    * { box-sizing: border-box; }
    #match-notice,.match-panel {
      color:#fff; border:1px solid rgba(255,255,255,.28);
      background:linear-gradient(125deg,rgba(var(--c1),.68),rgba(var(--c2),.64)),rgba(45,48,64,.68);
      backdrop-filter:blur(22px) saturate(1.15); -webkit-backdrop-filter:blur(22px) saturate(1.15);
      box-shadow:0 8px 28px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.13);
    }
    #match-notice {
      position:fixed; bottom:14px; left:50%; width:max-content; max-width:calc(100% - 28px);
      z-index:100; border-radius:22px; padding:11px 17px; font-family:inherit;
      font-size:12px; font-weight:600; line-height:1.5; text-align:center; pointer-events:none;
      opacity:0; transform:translate(-50%,7px); transition:opacity .24s ease,transform .24s ease;
    }
    #match-notice.visible { opacity:1; transform:translate(-50%,0); }
    #match-menu { position:fixed; inset:0; z-index:101; display:grid; place-items:center; padding:12px;
      background:rgba(30,32,47,.12); opacity:0; transition:opacity .2s ease; }
    .match-panel { width:100%; max-width:300px; max-height:100%; overflow:auto; border-radius:24px;
      padding:18px; display:grid; gap:10px; transform:translateY(10px) scale(.97); transition:transform .24s ease; }
    #match-menu.visible { opacity:1; }
    #match-menu.visible .match-panel { transform:translateY(0) scale(1); }
    .match-panel h3 { margin:0; font-size:16px; font-weight:700; }
    .match-panel p { margin:0 0 5px; font-size:11px; line-height:1.6; color:rgba(255,255,255,.76); }
    .match-panel button { width:100%; border:1px solid rgba(255,255,255,.18); border-radius:17px;
      padding:12px 10px; color:inherit; font:inherit; font-size:12px; font-weight:600;
      background:rgba(255,255,255,.12); transition:background .15s,transform .15s; }
    .match-panel button:first-of-type { color:#2b171b; background:linear-gradient(110deg,#fff1f3,#ff9dab); }
    .match-panel button:active { transform:scale(.97); }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      color:#fff;
      font-family: Inter, "SF Pro Display", "Noto Sans SC", system-ui, sans-serif;
      background:#111217;
      -webkit-font-smoothing:antialiased;
      user-select:none;
    }
    #fluid {
      position:fixed; inset:0; width:100%; height:100%; z-index:0;
      display:none;
      opacity:.78; transition:opacity 1.4s ease;
      filter:saturate(1.28) contrast(1.08);
    }
    body.background-medium #fluid,body.background-high #fluid { display:block; }
    #low-fluid {
      position:fixed; inset:0; z-index:0; display:none; overflow:hidden;
      background:#111217; contain:strict;
    }
    body.background-low #low-fluid { display:block; }
    .low-field {
      position:absolute; inset:-30%; opacity:0;
      overflow:hidden; transform:translateZ(0);
      background:linear-gradient(145deg,rgb(var(--l6)) 0%,rgb(var(--l2)) 48%,rgb(var(--l4)) 100%);
      transition:opacity 1.45s ease;
    }
    .low-field.active { opacity:1; }
    .low-blob {
      position:absolute; display:block; width:118%; height:118%; border-radius:50%;
      opacity:.78; will-change:transform; transform:translate3d(0,0,0);
    }
    .low-blob.one {
      left:-38%; top:-34%;
      background:radial-gradient(circle,rgba(var(--l1),.96) 0%,rgba(var(--l3),.64) 30%,rgba(var(--l3),.30) 61%,rgba(var(--l3),0) 100%);
      animation:lowDriftOne 27s ease-in-out infinite alternate;
    }
    .low-blob.two {
      right:-42%; top:-3%;
      background:radial-gradient(circle,rgba(var(--l2),.94) 0%,rgba(var(--l5),.60) 31%,rgba(var(--l5),.28) 63%,rgba(var(--l5),0) 100%);
      animation:lowDriftTwo 33s ease-in-out infinite alternate;
    }
    .low-blob.three {
      left:-2%; bottom:-52%;
      background:radial-gradient(circle,rgba(var(--l4),.94) 0%,rgba(var(--l6),.60) 32%,rgba(var(--l6),.28) 64%,rgba(var(--l6),0) 100%);
      animation:lowDriftThree 30s ease-in-out infinite alternate;
    }
    .low-field:not(.active) .low-blob,body.paused .low-blob { animation-play-state:paused; }
    @keyframes lowDriftOne {
      from { transform:translate3d(-2%,-2%,0) scale(1.03); }
      to { transform:translate3d(17%,14%,0) scale(1.12); }
    }
    @keyframes lowDriftTwo {
      from { transform:translate3d(3%,-4%,0) scale(1.10); }
      to { transform:translate3d(-18%,13%,0) scale(1.01); }
    }
    @keyframes lowDriftThree {
      from { transform:translate3d(-7%,4%,0) scale(1.06); }
      to { transform:translate3d(12%,-16%,0) scale(1.14); }
    }
    .shade {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:
        radial-gradient(circle at 50% -20%, rgba(255,255,255,.20), transparent 38%),
        linear-gradient(180deg, rgba(5,5,8,.10), rgba(5,5,8,.48));
      backdrop-filter:saturate(1.08);
    }
    #app { position:relative; z-index:2; height:100%; padding:8px; }
    .surface {
      height:100%; overflow:hidden; border-radius:20px;
      background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.07));
      border:1px solid rgba(255,255,255,.17);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 20px 50px rgba(0,0,0,.22);
      backdrop-filter:blur(22px) saturate(1.25);
    }
    #waiting {
      height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:24px; transition:opacity .25s ease;
    }
    .waiting-title { font-size:17px; font-weight:780; letter-spacing:-.02em; }
    .waiting-copy { margin-top:7px; max-width:235px; color:var(--muted); font-size:12px; line-height:1.55; }
    #player {
      height:100%; padding:9px; display:grid; grid-template-rows:58px 24px 15px minmax(0,1fr);
      gap:5px; opacity:0; transform:scale(.985); pointer-events:none;
      transition:opacity .32s ease,transform .32s cubic-bezier(.22,.8,.25,1);
    }
    .media-column,.lyrics-column { display:contents; }
    body.has-session #waiting { display:none; }
    body.has-session #player { opacity:1; transform:none; pointer-events:auto; }
    .metadata { display:grid; grid-template-columns:58px minmax(0,1fr); gap:10px; min-width:0; align-items:center; }
    .cover-wrap {
      position:relative; width:58px; height:58px; border-radius:13px; overflow:hidden;
      background:linear-gradient(135deg,rgba(var(--c1),.88),rgba(var(--c2),.9));
      box-shadow:0 13px 28px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.16);
    }
    #cover { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transform:scale(1.03); transition:opacity .45s,transform .7s; }
    #cover.ready { opacity:1; transform:none; }
    .playing-ring {
      position:absolute; inset:0; border:2px solid rgba(255,255,255,.38); border-radius:inherit;
      opacity:0; transform:scale(.94); transition:.35s;
    }
    body.playing .playing-ring { opacity:1; transform:scale(1); animation:ring 2s ease-in-out infinite; }
    @keyframes ring { 50% { border-color:rgba(255,255,255,.12); } }
    .meta-copy { min-width:0; }
    .eyebrow { display:flex; min-width:0; align-items:center; gap:7px; margin-bottom:4px; padding-right:112px; overflow:hidden; color:rgba(255,255,255,.68); font-size:9px; font-weight:720; letter-spacing:.1em; text-transform:uppercase; }
    .dot { flex:0 0 auto; width:6px; height:6px; border-radius:99px; background:#a5a8b0; }
    body.playing .dot { background:#fa2d48; box-shadow:0 0 9px rgba(250,45,72,.58); animation:pulse 1.7s ease-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 60% { opacity:.55; transform:scale(.78); } }
    #track { overflow:hidden; white-space:nowrap; font-size:17px; line-height:1.12; font-weight:830; letter-spacing:-.035em; text-shadow:none; }
    #state-viewport { flex:1 1 auto; min-width:0; overflow:hidden; white-space:nowrap; }
    #state-label,#track-text { display:inline-block; white-space:nowrap; will-change:transform; }
    #track-text { min-width:100%; }
    .loop-marquee.marquee .loop-marquee-text::after {
      content:attr(data-marquee-copy); padding-left:var(--marquee-gap,34px);
    }
    .loop-marquee.marquee .loop-marquee-text {
      animation:continuousMarquee var(--marquee-duration,9s) linear infinite;
    }
    @keyframes continuousMarquee {
      to { transform:translate3d(var(--marquee-shift,0px),0,0); }
    }
    .artist-row { min-width:0; margin-top:3px; }
    #artist-viewport,.progress-time { font-family:inherit; color:var(--muted); font-size:11px; font-weight:560; line-height:normal; letter-spacing:normal; text-shadow:none; }
    #artist-viewport { min-width:0; overflow:hidden; white-space:nowrap; }
    #artist { display:inline-block; min-width:100%; white-space:nowrap; will-change:transform; }
    .transport-controls {
      display:inline-flex; align-items:center; gap:5px; height:22px;
    }
    .transport-button {
      display:grid; place-items:center; width:34px; height:22px; padding:0;
      color:rgba(255,255,255,.9); background:rgba(255,255,255,.11);
      border:1px solid rgba(255,255,255,.13); border-radius:99px; outline:none;
      -webkit-tap-highlight-color:transparent; transition:background-color .14s ease,opacity .14s ease,transform .1s ease;
    }
    .transport-button svg { display:block; width:15px; height:15px; fill:currentColor; }
    .transport-button:active:not(:disabled) { background:rgba(255,255,255,.18); transform:scale(.91); }
    .transport-button:disabled { opacity:.28; }
    .transport-button .pause-icon { display:none; }
    .transport-button.is-pausing .play-icon { display:none; }
    .transport-button.is-pausing .pause-icon { display:block; }
    .transport-row { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:5px; min-width:0; }
    .chips-viewport { min-width:0; height:22px; overflow:hidden; }
    .chips-viewport.is-scrolling,.loop-marquee.marquee,
    .compact-text-viewport.marquee,.compact-text-viewport.is-overflowing {
      -webkit-mask-image:linear-gradient(to right,transparent,#000 min(9px,12%),#000 calc(100% - min(9px,12%)),transparent);
      mask-image:linear-gradient(to right,transparent,#000 min(9px,12%),#000 calc(100% - min(9px,12%)),transparent);
    }
    .chips-track { display:flex; width:max-content; height:22px; will-change:transform; }
    .chips-track.marquee { animation:chipsMarquee var(--chips-duration,9s) linear infinite; }
    @keyframes chipsMarquee { to { transform:translate3d(var(--chips-shift,0px),0,0); } }
    .chips { display:flex; flex:0 0 auto; gap:5px; flex-wrap:nowrap; min-height:22px; }
    .chips-copy { margin-left:28px; }
    .chip {
      display:inline-flex; align-items:center; height:22px; padding:0 7px; border-radius:99px;
      background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.72); font-size:9px; font-weight:720; letter-spacing:.04em; white-space:nowrap;
    }
    .volume-chip { padding:0 6px; justify-content:center; gap:3px; }
    .volume-chip svg { width:12px; height:12px; fill:currentColor; }
    .source-chip {
      cursor:pointer; max-width:130px; overflow:hidden; text-overflow:ellipsis;
      outline:none; -webkit-tap-highlight-color:transparent;
      transition:background-color .16s ease,border-color .16s ease,transform .12s ease;
    }
    .source-chip:active {
      background:rgba(255,255,255,.20); border-color:rgba(255,255,255,.22); transform:scale(.97);
    }
    .lyrics-viewport { position:relative; overflow:hidden; min-height:0; border-radius:14px; touch-action:none; }
    .lyrics-viewport {
      -webkit-mask-image:linear-gradient(to bottom,transparent,#000 min(14px,8%),#000 calc(100% - min(14px,8%)),transparent);
      mask-image:linear-gradient(to bottom,transparent,#000 min(14px,8%),#000 calc(100% - min(14px,8%)),transparent);
    }
    .lyrics-viewport::before,.lyrics-viewport::after { content:""; position:absolute; z-index:3; left:0; right:0; height:25%; pointer-events:none; }
    .lyrics-viewport::before { top:0; background:linear-gradient(to bottom,rgba(17,18,23,.48),transparent); }
    .lyrics-viewport::after { bottom:0; background:linear-gradient(to top,rgba(17,18,23,.42),transparent); }
    #lyrics {
      position:absolute; top:0; left:0; right:0; padding:42% 5px;
      transition:transform .48s cubic-bezier(.22,.75,.18,1);
      will-change:transform;
    }
    #lyrics.manual-dragging,#lyrics.plain-scrolling { transition:none; }
    #lyrics.plain-mode .line,#lyrics.plain-mode .line.near,#lyrics.plain-mode .line.past,
    #lyrics.plain-mode .line.active {
      color:rgb(var(--lyric-rgb)); opacity:1; filter:none; transform:none;
      font-size:var(--lyric-active-size); font-weight:760;
    }
    .line {
      padding:var(--lyric-line-padding) 5px; color:rgba(var(--lyric-rgb),.34); font-size:var(--lyric-font-size); line-height:1.35; font-weight:620;
      transform-origin:left center; filter:blur(.18px);
      transition:color .35s,opacity .35s,transform .42s,filter .35s,text-shadow .35s;
    }
    .line.near { color:rgba(var(--lyric-rgb),.58); filter:none; }
    .line.active {
      color:rgb(var(--lyric-rgb)); transform:scale(1.04); filter:none; font-size:var(--lyric-active-size); font-weight:820;
      text-shadow:0 4px 20px rgba(0,0,0,.3);
    }
    .line.past { color:rgba(var(--lyric-rgb),.24); }
    .line.loading,.line.empty { color:rgba(var(--lyric-rgb),.55); font-weight:620; }
    .line-original { display:block; }
    body.lyric-stroke .line-original,body.lyric-stroke .line-translation,
    body.lyric-stroke .line-pronunciation,body.lyric-stroke .compact-scroll-text {
      /* Outline the composited glyphs so background-clipped karaoke fills stay visible. */
      filter:drop-shadow(.65px 0 0 var(--lyric-stroke-color,#161616))
        drop-shadow(-.65px 0 0 var(--lyric-stroke-color,#161616))
        drop-shadow(0 .65px 0 var(--lyric-stroke-color,#161616))
        drop-shadow(0 -.65px 0 var(--lyric-stroke-color,#161616));
    }
    .line-pronunciation,.line-translation { display:block; margin-top:3px; color:rgba(var(--lyric-rgb),.66); font-size:.56em; line-height:1.3; font-weight:620; }
    .line-pronunciation { margin-top:0; margin-bottom:3px; }
    .line:not(.active) .line-pronunciation,.line:not(.active) .line-translation { color:inherit; opacity:.78; }
    .word { color:inherit; }
    .line.active .word {
      color:transparent; background:linear-gradient(90deg,rgb(var(--lyric-rgb)) 0 var(--word-fill,0%),rgba(var(--lyric-rgb),.34) var(--word-fill,0%) 100%);
      background-clip:text; -webkit-background-clip:text;
    }
    .compact-lyric { display:none; position:relative; min-width:0; min-height:0; overflow:hidden; }
    .compact-lyric {
      -webkit-mask-image:linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent);
      mask-image:linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent);
    }
    .compact-line {
      position:absolute; left:0; right:0; top:0; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:stretch; padding:0 4px 0 14px;
      overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
      color:rgb(var(--lyric-rgb)); font-size:var(--compact-font-size); line-height:1.15; font-weight:840; letter-spacing:-.035em;
      text-shadow:none;
      transform:translate3d(0,100%,0); will-change:transform;
      transition:transform .38s cubic-bezier(.22,.8,.25,1);
    }
    .compact-line.current { transform:translate3d(0,0,0); }
    .compact-line.outgoing { transform:translate3d(0,-100%,0); }
    .compact-line.no-transition { transition:none; }
    .compact-line-text { display:block; width:100%; min-width:0; overflow:hidden; white-space:nowrap; }
    .compact-next-line { display:none; width:100%; min-width:0; overflow:hidden; white-space:nowrap; color:rgba(var(--lyric-rgb),.52); font-size:var(--compact-next-size); line-height:1.15; font-weight:680; }
    .compact-scroll-text { display:inline-block; min-width:100%; will-change:transform; }
    .compact-word {
      color:transparent; background:linear-gradient(90deg,rgb(var(--lyric-rgb)) 0 var(--word-fill,0%),rgba(var(--lyric-rgb),.38) var(--word-fill,0%) 100%);
      background-clip:text; -webkit-background-clip:text;
    }
    .compact-text-viewport.marquee .compact-scroll-text {
      animation:compactTextSweep var(--compact-duration,3s) cubic-bezier(.3,0,.2,1) var(--compact-delay,.7s) 1 both;
    }
    body.paused .compact-text-viewport.marquee .compact-scroll-text { animation-play-state:paused; }
    @keyframes compactTextSweep {
      from { margin-left:0; }
      to { margin-left:var(--compact-shift,0px); }
    }
    body.compact.compact-two .compact-line { padding-top:2px; padding-bottom:2px; }
    body.compact.compact-two .compact-next-line { display:block; }
    .compact-pronunciation { display:none; width:100%; min-width:0; overflow:hidden; white-space:nowrap; }
    .compact-pronunciation,.compact-next-line[data-translation="1"] {
      color:rgba(var(--lyric-rgb),.66); font-size:calc(var(--compact-font-size)*.56);
      line-height:1.3; font-weight:620;
    }
    body.compact.compact-three .compact-pronunciation { display:block; }
    .footer {
      display:grid; grid-template-columns:minmax(30px,auto) minmax(0,1fr) minmax(30px,auto);
      align-items:center; column-gap:8px; padding:0 1px;
    }
    .progress-shell { position:relative; height:15px; overflow:hidden; border-radius:999px; background:transparent; touch-action:none; }
    .progress-shell::before { content:""; position:absolute; left:0; right:0; top:4.5px; height:6px; border-radius:999px; background:rgba(255,255,255,.22); }
    #progress {
      position:absolute; left:0; top:4.5px; width:0; height:6px; border-radius:999px; background:#fff;
      transition:width .1s linear;
    }
    .progress-shell.seeking #progress { transition:none; }
    .progress-time {
      font-variant-numeric:tabular-nums; white-space:nowrap;
    }
    .progress-time.total { text-align:right; }
    body.paused #fluid { opacity:.52; }
    body.background-transparent { background:transparent; }
    body.background-transparent #fluid,
    body.background-transparent #low-fluid,
    body.background-transparent .shade { display:none; }
    body.background-transparent .surface {
      border-color:transparent; box-shadow:none; background:transparent;
      backdrop-filter:none; -webkit-backdrop-filter:none;
    }
    body.background-transparent .lyrics-viewport::before,
    body.background-transparent .lyrics-viewport::after { display:none; }
    body.background-low .shade { backdrop-filter:none; -webkit-backdrop-filter:none; }
    body.background-low .surface { backdrop-filter:none; -webkit-backdrop-filter:none; }
    body.compact #app { padding:0 14px 0 0; }
    body.compact .surface {
      border:0; border-radius:0; box-shadow:none; background:transparent;
      backdrop-filter:none; -webkit-backdrop-filter:none;
    }
    body.compact #player { padding:0; gap:0; grid-template-rows:minmax(0,1fr); }
    body.compact .metadata,body.compact .transport-row,body.compact .footer { display:none; }
    body.compact .lyrics-viewport { display:none; }
    body.compact .compact-lyric { display:block; }
    body.horizontal-layout:not(.compact) #player {
      grid-template-columns:minmax(78px,2.5fr) minmax(0,7.5fr);
      grid-template-rows:minmax(0,1fr);
      gap:8px;
    }
    body.horizontal-layout:not(.compact) .lyrics-column {
      grid-column:2;
      grid-row:1;
      display:grid;
      grid-template-rows:minmax(0,1fr);
      min-width:0;
      min-height:0;
    }
    body.horizontal-layout:not(.compact) .media-column {
      grid-column:1;
      grid-row:1;
      display:grid;
      grid-template-rows:minmax(0,1fr) 51px 15px;
      gap:5px;
      min-width:0;
      min-height:0;
    }
    body.horizontal-layout:not(.compact) .metadata {
      grid-template-columns:minmax(0,1fr);
      grid-template-rows:76px auto;
      align-content:center;
      justify-items:center;
      gap:7px;
    }
    body.horizontal-layout:not(.compact) .cover-wrap { width:68px; height:68px; border-radius:15px; }
    body.horizontal-layout:not(.compact) .meta-copy { width:100%; text-align:center; }
    body.horizontal-layout:not(.compact) .eyebrow { justify-content:center; padding-right:0; }
    body.horizontal-layout:not(.compact) .transport-row {
      grid-template-columns:minmax(0,1fr);
      grid-template-rows:24px 22px;
      gap:5px;
    }
    body.horizontal-layout:not(.compact) .transport-controls { justify-self:center; }
    body.horizontal-layout:not(.compact) .chips-viewport { width:100%; }
    body.horizontal-layout:not(.compact) .footer { column-gap:4px; }
    @media (max-width:170px) {
      body:not(.compact) #player { padding-left:7px; padding-right:7px; }
      body:not(.compact) .metadata { grid-template-columns:minmax(0,1fr); }
      body:not(.compact) .cover-wrap { display:none; }
      body:not(.compact) .eyebrow { padding-right:112px; }
    }
  </style>
</head>
<body class="background-transparent">
  <canvas id="fluid"></canvas>
  <div id="low-fluid" aria-hidden="true">
    <div class="low-field low-field-a active">
      <i class="low-blob one"></i><i class="low-blob two"></i><i class="low-blob three"></i>
    </div>
    <div class="low-field low-field-b">
      <i class="low-blob one"></i><i class="low-blob two"></i><i class="low-blob three"></i>

  </div>
  <div class="shade"></div>
  <div id="app">
    <section class="surface">
      <div id="waiting">
        <div class="waiting-title">等待音乐播放</div>
        <div class="waiting-copy" id="waiting-copy">打开 Apple Music 或其他音乐软件后，歌词会自动出现。</div>
      </div>
      <div id="player">
        <div class="media-column">
          <header class="metadata">
            <div class="cover-wrap">
              <img id="cover" alt="专辑封面" referrerpolicy="no-referrer">
              <div class="playing-ring"></div>
            </div>
            <div class="meta-copy">
              <div class="eyebrow"><span class="dot"></span><span class="loop-marquee" id="state-viewport"><span class="loop-marquee-text" id="state-label">本地媒体会话</span></span></div>
              <div class="loop-marquee" id="track"><span class="loop-marquee-text" id="track-text">未知歌曲</span></div>

                <div class="loop-marquee" id="artist-viewport"><span class="loop-marquee-text" id="artist">未知歌手</span></div>
              </div>
            </div>

              <button class="transport-button" id="previous-button" type="button" title="上一首" aria-label="上一首">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5.2a1 1 0 0 1 1 1v4.24l8.37-5.12A1.4 1.4 0 0 1 18 6.52v10.96a1.4 1.4 0 0 1-2.13 1.2L7.5 13.56v4.24a1 1 0 1 1-2 0V6.2a1 1 0 0 1 1-1Z"/></svg>
              </button>
              <button class="transport-button" id="play-pause-button" type="button" title="播放" aria-label="播放">
                <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.1 5.25a1.3 1.3 0 0 1 1.98-1.1l10.04 6.75a1.32 1.32 0 0 1 0 2.2L10.08 19.85a1.3 1.3 0 0 1-1.98-1.1V5.25Z"/></svg>
                <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.5A1.2 1.2 0 0 1 8.4 3.3h1.2a1.2 1.2 0 0 1 1.2 1.2v15a1.2 1.2 0 0 1-1.2 1.2H8.4a1.2 1.2 0 0 1-1.2-1.2v-15Zm6 0a1.2 1.2 0 0 1 1.2-1.2h1.2a1.2 1.2 0 0 1 1.2 1.2v15a1.2 1.2 0 0 1-1.2 1.2h-1.2a1.2 1.2 0 0 1-1.2-1.2v-15Z"/></svg>
              </button>
              <button class="transport-button" id="next-button" type="button" title="下一首" aria-label="下一首">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 5.2a1 1 0 0 0-1 1v4.24L8.13 5.32A1.4 1.4 0 0 0 6 6.52v10.96a1.4 1.4 0 0 0 2.13 1.2l8.37-5.12v4.24a1 1 0 1 0 2 0V6.2a1 1 0 0 0-1-1Z"/></svg>
              </button>
            </div>
            <div class="chips-viewport" id="chips-viewport">
              <div class="chips-track" id="chips-track">
                <div class="chips" id="chips-primary">
                  <span class="chip volume-chip" id="volume-chip" title="音量">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.1h3.16l4.25-3.7a1 1 0 0 1 1.65.76v11.68a1 1 0 0 1-1.65.76l-4.25-3.7H4.5a1.5 1.5 0 0 1-1.5-1.5v-2.8a1.5 1.5 0 0 1 1.5-1.5Zm12.05-.82a1 1 0 0 1 1.41.08 5.5 5.5 0 0 1 0 7.28 1 1 0 1 1-1.49-1.33 3.5 3.5 0 0 0 0-4.62 1 1 0 0 1 .08-1.41Zm2.8-2.42a1 1 0 0 1 1.41.08 9.2 9.2 0 0 1 0 12.12 1 1 0 0 1-1.49-1.34 7.2 7.2 0 0 0 0-9.44 1 1 0 0 1 .08-1.42Z"/></svg>
                    <span id="volume-value">--%</span>
                  </span>
                  <span class="chip source-chip" id="source-chip" title="点击切换歌词源">歌词源</span>
                  <span class="chip" id="supplement-chip" style="display:none" title="补充翻译设置"></span>
                </div>
              </div>

          <footer class="footer">
            <span class="progress-time current" id="current-time">0:00</span>
            <div class="progress-shell" id="progress-shell"><div id="progress"></div></div>
            <span class="progress-time total" id="duration-time">0:00</span>
          </footer>
        </div>
        <div class="lyrics-column">
          <div class="lyrics-viewport" id="lyrics-viewport">
            <div id="lyrics"><div class="line loading">正在匹配歌词…</div></div>
          </div>
          <div class="compact-lyric" id="compact-lyric"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const ui = {
      waitingCopy: $('waiting-copy'), trackBox: $('track'), track: $('track-text'), artistBox: $('artist-viewport'), artist: $('artist'), cover: $('cover'),
      stateBox: $('state-viewport'), state: $('state-label'), lyrics: $('lyrics'), viewport: $('lyrics-viewport'),
      progressShell: $('progress-shell'), progress: $('progress'), current: $('current-time'), duration: $('duration-time'),
      volume: $('volume-chip'), volumeValue: $('volume-value'), source: $('source-chip'), compactLyric: $('compact-lyric'),
      previous: $('previous-button'), playPause: $('play-pause-button'), next: $('next-button'),
      chipsViewport: $('chips-viewport'), chipsTrack: $('chips-track'), chipsPrimary: $('chips-primary')
    };
    let backgroundMode = 'transparent';
    let lyricFontScale=1;
    let translationMode='bilingual';
    let pronunciationEnabled=false;
    const playback = {
      hasSession:false, track:'', artist:'', album:'', state:'paused', positionMs:0,
      durationMs:0, speed:0, receivedAt:performance.now(), key:'', lyrics:[], active:-1,
      cover:'', coverIsNative:false, requestId:0, abort:null, lyricOffsetMs:0,
      candidates:[], candidateIndex:0, canPlay:false, canPause:false, canPrevious:false, canNext:false, canSeek:false
    };
    let manualLyricsScroll=false,lyricsTranslateY=0,manualReturnTimer=0;
    let plainResumeStartedAt=0,plainResumeFrom=0;
    let lyricTouchActive=false,lyricTouchMoved=false,lyricTouchStartY=0,lyricTouchStartTranslate=0;
    let lyricTouchLastY=0,lyricTouchLastAt=0,lyricVelocity=0,lyricMomentumFrame=0;
    let progressSeeking=false,progressSeekTarget=0;
    let supplementEpoch=0;
    let currentHasOfficialTranslation=false;
    let candidateSignature='';
    let sourceSwitchUnlockAt=0;
    let lyricsRelayoutEpoch=0;
    let lyricsTrackingSuspended=false;
    let supplementRequestTimer=0;
    let supplementInFlight=false;
    let supplementWindowEnd=-1;
    let supplementPrefetchRemaining=4;
    const LYRICS_CACHE_SCHEMA=4;
    const supplementChip=$('supplement-chip');

    function requestSupplement(reset=true) {
      clearTimeout(supplementRequestTimer);
      supplementRequestTimer=0;
      if(reset){
        supplementWindowEnd=-1;
        supplementInFlight=false;
        supplementChip.style.display='none';
        ++supplementEpoch;
        if(window.LobstaNativeLyrics&&window.LobstaNativeLyrics.cancelSupplement)window.LobstaNativeLyrics.cancelSupplement();
      }
      if(translationMode==='original'||currentHasOfficialTranslation||!playback.lyrics.length)return;
      supplementRequestTimer=setTimeout(startSupplementWindow,reset?520:80);
    }

    function startSupplementWindow() {
      supplementRequestTimer=0;
      if(supplementInFlight||translationMode==='original'||currentHasOfficialTranslation||!playback.lyrics.length)return;
      const active=plainPlaybackIndex();
      let strategy={behind:2,ahead:12,prefetch:4};
      if(window.LobstaNativeLyrics&&window.LobstaNativeLyrics.supplementStrategy){
        try{strategy={...strategy,...JSON.parse(window.LobstaNativeLyrics.supplementStrategy())};}catch(_){}
      }
      const behind=Math.max(0,Math.min(8,Number(strategy.behind)||2));
      const ahead=Math.max(6,Math.min(48,Number(strategy.ahead)||12));
      supplementPrefetchRemaining=Math.max(2,Math.min(16,Number(strategy.prefetch)||4));
      const from=Math.max(0,active-behind);
      const to=Math.min(playback.lyrics.length,active+ahead+1);
      supplementWindowEnd=Math.max(active,to-1);
      const missing=[];
      for(let id=from;id<to;id++){
        const line=playback.lyrics[id];
        if(line&&!line.translation&&!line.supplement&&line.text.trim())missing.push({id,text:line.text});
      }
      const translated=playback.lyrics.find(line=>line.supplement);
      if(translated){supplementChip.textContent=translated.supplement;supplementChip.style.display='inline-flex';}
      updateInfoMarquee();
      if(!missing.length)return;
      const epoch=++supplementEpoch;
      if(missing.length&&window.LobstaNativeLyrics&&window.LobstaNativeLyrics.translateMissing){
        supplementInFlight=true;
        window.LobstaNativeLyrics.translateMissing(epoch,JSON.stringify(missing));
      }
    }

    function maybePrefetchSupplement() {
      if(supplementInFlight||supplementRequestTimer||translationMode==='original'||currentHasOfficialTranslation)return;
      if(supplementWindowEnd<0||plainPlaybackIndex()>=supplementWindowEnd-supplementPrefetchRemaining)requestSupplement(false);
    }

    function receiveSupplement(epoch,data) {
      if(epoch!==supplementEpoch||currentHasOfficialTranslation||!data)return;
      if(data.status){
        const any=playback.lyrics.find(line=>line.supplement);
        const failed=data.status==='error';
        if(data.status==='done'||failed) supplementInFlight=false;
        supplementChip.style.display=any||failed?'inline-flex':'none';
        supplementChip.textContent=failed?'翻译失败':any?any.supplement:'';
        supplementChip.title=data.message||'补充翻译设置';
        updateInfoMarquee();
        if(data.status==='done')maybePrefetchSupplement();
        return;
      }
      const line=playback.lyrics[data.id];
      if(!line||line.translation||!data.text)return;
      line.translation=data.text;
      line.supplement=data.source;
      supplementChip.textContent=data.source;
      supplementChip.style.display='inline-flex';
      supplementChip.title=data.source==='AI 译'?'由自定义 API 补充':'由离线语言包补充';
      const node=ui.lyrics.children[data.id];
      if(node)node.innerHTML=lineHtml(line);
      if(!lyricsTrackingSuspended){
        updateActiveLine(lyricPosition(),true);
        updateWordProgress(lyricPosition());
      }
    }

    const escapeHtml = value => String(value || '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[ch]);

    function formatTime(ms) {
      if (!Number.isFinite(ms) || ms < 0) ms = 0;
      const seconds = Math.floor(ms / 1000);
      return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
    }

    function normalizedKey(track, artist) {
      return (track + '\u0000' + artist).trim().toLocaleLowerCase();
    }

    function currentPosition() {
      let value = playback.positionMs;
      if (playback.state === 'playing' && playback.speed > 0) {
        value += (performance.now() - playback.receivedAt) * playback.speed;
      }
      if (playback.durationMs > 0) value = Math.min(value, playback.durationMs);
      return Math.max(0, value);
    }

    function lyricPosition() {
      return Math.max(0,currentPosition()+Number(playback.lyricOffsetMs||0));
    }

    function parseLrc(raw) {
      if (!raw) return [];
      const parsed = [];
      const credit = /^(作词|作曲|编曲|制作人|混音|母带|录音|和声|监制|出品|发行|词|曲)\s*[：:]/i;
      String(raw).replace(/\r/g, '').split('\n').forEach(line => {
        const stamps = [...line.matchAll(/\[(\d{1,3}):(\d{2})(?:[\.:](\d{1,3}))?\]/g)];
        if (!stamps.length) return;
        const text = line.replace(/\[[^\]]+\]/g, '').trim();
        if (!text || credit.test(text)) return;
        stamps.forEach(match => {
          const fraction = match[3] ? Number(('0.' + match[3])) * 1000 : 0;
          parsed.push({ t:(Number(match[1]) * 60 + Number(match[2])) * 1000 + fraction, text });
        });
      });
      parsed.sort((a,b) => a.t - b.t);
      return parsed.filter((line,index,list) => !index || line.t !== list[index-1].t || line.text !== list[index-1].text);
    }

    function plainLyrics(raw) {
      return String(raw || '').replace(/\r/g,'').split('\n').map(v => v.trim()).filter(Boolean)
        .filter(v => !/^\[[a-z]+:/i.test(v))
        .map(v=>v.replace(/^(?:\[\d+:\d+[^\]]*\])+\s*/,''))
        .filter(v=>v&&!/^(作词|作詞|作曲|编曲|編曲|词|曲|composer|lyricist|arranger)\s*[:：]/i.test(v))
        .map((text,index) => ({ t:index * 100000000, text, plain:true }));
    }

    function parseWordLyrics(raw) {
      if(!raw)return [];
      const lines=[];
      const credit=/^(作词|作曲|编曲|制作人|混音|母带|录音|和声|监制|出品|发行|词|曲)\s*[：:]/i;
      String(raw).replace(/\r/g,'').split('\n').forEach(rawLine=>{
        const header=rawLine.match(/^\[(\d+),(\d+)\](.*)$/);
        if(!header)return;
        const words=[];
        const body=header[3]||'';
        const matcher=/\((\d+),(\d+)(?:,\d+)?\)/g;
        const tokens=[];
        let match;
        while((match=matcher.exec(body))){
          tokens.push({start:Number(match[1]),duration:Number(match[2]),textStart:matcher.lastIndex,markerStart:match.index});
        }
        tokens.forEach((token,index)=>{
          const text=body.slice(token.textStart,index+1<tokens.length?tokens[index+1].markerStart:body.length);
          if(text)words.push({start:token.start,duration:token.duration,text});
        });
        const text=words.map(word=>word.text).join('').trim();
        if(!text||credit.test(text))return;
        lines.push({t:Number(header[1]),duration:Number(header[2]),text,words});
      });
      return lines.sort((a,b)=>a.t-b.t);
    }

    function attachTranslations(lines,raw,field="translation") {
      if(!lines.length||!raw)return lines;
      const translations=parseLrc(raw);
      if(!translations.length)return lines;
      let cursor=0;
      return lines.map(line=>{
        while(cursor+1<translations.length&&Math.abs(translations[cursor+1].t-line.t)<=Math.abs(translations[cursor].t-line.t))cursor++;
        const match=translations[cursor];
        return {...line,[field]:match&&Math.abs(match.t-line.t)<=1200?match.text:''};
      });
    }

    function compactSupplement(line) {
      return translationMode==='bilingual' ? line.translation||'' : '';
    }

    function linePrimaryText(line) {
      return translationMode==='translated'&&line.translation ? line.translation : line.text;
    }

    function lineHtml(line) {
      const useWords=translationMode!=='translated'&&Array.isArray(line.words)&&line.words.length;
      const original=useWords
        ? line.words.map((word,index)=>'<span class="word" data-word="'+index+'">'+escapeHtml(word.text)+'</span>').join('')
        : escapeHtml(linePrimaryText(line));
      const translation=translationMode==='bilingual'&&line.translation
        ? '<span class="line-translation">'+escapeHtml(line.translation)+'</span>'
        : '';
      const pronunciation=pronunciationEnabled&&line.pronunciation
        ? '<span class="line-pronunciation">'+escapeHtml(line.pronunciation)+'</span>' : '';
      return pronunciation+'<span class="line-original">'+original+'</span>'+translation;
    }

    function renderLyrics(lines, message) {
      const relayoutEpoch=++lyricsRelayoutEpoch;
      lyricsTrackingSuspended=true;
      resetManualLyricsScroll();
      ui.lyrics.classList.add('manual-dragging');
      playback.lyrics = lines || [];
      playback.active = -1;
      if (!playback.lyrics.length) {
        ui.lyrics.classList.remove('plain-mode','plain-scrolling');
        ui.lyrics.innerHTML = '<div class="line empty">' + escapeHtml(message || '暂无歌词') + '</div>';
        ui.lyrics.style.transform = 'translateY(0)';
        setCompactLyric(message || '暂无歌词', false);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          if(relayoutEpoch!==lyricsRelayoutEpoch)return;
          lyricsTrackingSuspended=false;
          ui.lyrics.classList.remove('manual-dragging');
        }));
        return;
      }
      ui.lyrics.innerHTML = playback.lyrics.map((line,index) =>
        '<div class="line" data-i="' + index + '">' + lineHtml(line) + '</div>'
      ).join('');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        if(relayoutEpoch!==lyricsRelayoutEpoch)return;
        updateActiveLine(lyricPosition(),true);
        updateWordProgress(lyricPosition());
        lyricsTrackingSuspended=false;
        if(!manualLyricsScroll)ui.lyrics.classList.remove('manual-dragging');
      }));
    }

    let compactLineKey = '';
    let compactCleanupTimer = 0;
    let compactMarqueeFrame = 0;
    const compactWordFollow={key:'',shift:0,target:0,position:0,lastAt:0,width:0,contentWidth:0};

    function setCompactTiming(viewport, delay, timeBudget) {
      viewport.dataset.requestedDelay = String(delay);
      if (Number.isFinite(timeBudget) && timeBudget > 0) {
        viewport.dataset.timeBudget = String(timeBudget);
      } else {
        delete viewport.dataset.timeBudget;
      }
    }

    function compactTextNode(className, text, delay, timeBudget, timedLine) {
      const viewport = document.createElement('span');
      viewport.className = className + ' compact-text-viewport';
      setCompactTiming(viewport, delay, timeBudget);
      const content = document.createElement('span');
      content.className = 'compact-scroll-text';
      if(translationMode!=='translated'&&timedLine&&Array.isArray(timedLine.words)&&timedLine.words.length){
        viewport.dataset.wordTimed='1';
        timedLine.words.forEach((word,index)=>{
          const span=document.createElement('span');
          span.className='compact-word';
          span.dataset.word=String(index);
          span.textContent=word.text;
          content.appendChild(span);
        });
      }else{
        content.textContent = text;
      }
      viewport.appendChild(content);
      return viewport;
    }

    function updateCompactMarquees() {
      if (compactMarqueeFrame) cancelAnimationFrame(compactMarqueeFrame);
      const viewports = ui.compactLyric.querySelectorAll('.compact-text-viewport');
      viewports.forEach(viewport => {
        viewport.classList.remove('marquee');
        viewport.style.removeProperty('--compact-shift');
        viewport.style.removeProperty('--compact-duration');
        viewport.style.removeProperty('--compact-delay');
      });
      compactMarqueeFrame = requestAnimationFrame(() => {
        compactMarqueeFrame = 0;
        if (!document.body.classList.contains('compact')) return;
        viewports.forEach(viewport => {
          if (!viewport.clientWidth || !viewport.offsetHeight) return;
          if (viewport.classList.contains('compact-next-line')&&viewport.dataset.translation!=='1') return;
          if (viewport.dataset.wordTimed==='1') return;
          const content = viewport.querySelector('.compact-scroll-text');
          const overflow = Math.ceil(content.scrollWidth - viewport.clientWidth);
          if (overflow <= 4) return;
          const requestedDelay = Math.max(0, Number(viewport.dataset.requestedDelay || 0));
          const timeBudget = Number(viewport.dataset.timeBudget || 0);
          const hasDeadline = Number.isFinite(timeBudget) && timeBudget > 0;
          const delay = hasDeadline
            ? Math.min(requestedDelay, timeBudget * .18)
            : requestedDelay;
          const naturalDuration = Math.min(5.2, Math.max(1.8, 1.45 + overflow / 90));
          const endPadding = hasDeadline ? Math.min(.18, timeBudget * .06) : 0;
          const availableDuration = hasDeadline
            ? Math.max(.08, timeBudget - delay - endPadding)
            : naturalDuration;
          const duration = Math.min(naturalDuration, availableDuration);
          viewport.style.setProperty('--compact-shift', -(overflow + 6) + 'px');
          viewport.style.setProperty('--compact-delay', delay + 's');
          viewport.style.setProperty('--compact-duration', duration + 's');
          viewport.classList.add('marquee');
        });
      });
    }

    function setCompactLyric(text, animate, followingText, currentTimeBudget, timedLine, secondaryIsTranslation) {
      const value = String(text || '暂无歌词');
      const following = String(followingText || '').trim();
      const reading=pronunciationEnabled&&timedLine?String(timedLine.pronunciation||'').trim():'';
      const timingKey=timedLine&&Array.isArray(timedLine.words)&&timedLine.words.length?String(timedLine.t):'';
      const key = value + '\u0000' + following + '\u0000' + reading + '\u0000' + timingKey +
        '\u0000' + (secondaryIsTranslation?'translation':'candidate');
      if (key === compactLineKey && ui.compactLyric.children.length) {
        const current = ui.compactLyric.querySelector('.compact-line.current');
        const currentViewport = current && current.querySelector('.compact-line-text');
        if (currentViewport) setCompactTiming(currentViewport, .75, currentTimeBudget);
        const secondaryViewport=current&&current.querySelector('.compact-next-line[data-translation="1"]');
        if(secondaryViewport)setCompactTiming(secondaryViewport,.65,currentTimeBudget);
        const readingViewport=current&&current.querySelector('.compact-pronunciation');
        if(readingViewport)setCompactTiming(readingViewport,.65,currentTimeBudget);
        updateCompactMarquees();
        return;
      }
      compactLineKey = key;
      clearTimeout(compactCleanupTimer);

      const previous = ui.compactLyric.querySelector('.compact-line.current');
      const next = document.createElement('div');
      next.className = 'compact-line' + (animate && previous ? '' : ' current no-transition');
      if(reading) {
        next.classList.add('has-pronunciation');
        next.appendChild(compactTextNode('compact-pronunciation',reading,.65,currentTimeBudget));
      }
      next.appendChild(compactTextNode('compact-line-text', value, .75, currentTimeBudget, timedLine));
      if (following && (!reading || secondaryIsTranslation)) {
        const secondary=compactTextNode(
          'compact-next-line',
          following,
          secondaryIsTranslation ? .65 : 0,
          secondaryIsTranslation ? currentTimeBudget : 0
        );
        if(secondaryIsTranslation)secondary.dataset.translation='1';
        next.appendChild(secondary);
      }

      if (!animate || !previous) {
        ui.compactLyric.replaceChildren(next);
        updateCompactLayout();
        requestAnimationFrame(() => {
          next.classList.remove('no-transition');
          updateCompactMarquees();
        });
        return;
      }

      ui.compactLyric.querySelectorAll('.compact-line:not(.current)').forEach(node => node.remove());
      ui.compactLyric.appendChild(next);
      next.getBoundingClientRect();
      requestAnimationFrame(() => {
        previous.classList.remove('current');
        previous.classList.add('outgoing');
        next.classList.add('current');
        updateCompactLayout();
        updateCompactMarquees();
      });
      compactCleanupTimer = setTimeout(() => {
        ui.compactLyric.querySelectorAll('.compact-line').forEach(node => {
          if (node !== next) node.remove();
        });
      }, 400);
    }

    function setLyricsTranslate(value) {
      lyricsTranslateY=value;
      ui.lyrics.style.transform='translateY('+value+'px)';
    }

    function resetManualLyricsScroll() {
      clearTimeout(manualReturnTimer);
      if(lyricMomentumFrame)cancelAnimationFrame(lyricMomentumFrame);
      manualReturnTimer=0;
      lyricMomentumFrame=0;
      lyricVelocity=0;
      manualLyricsScroll=false;
      lyricTouchActive=false;
      lyricTouchMoved=false;
      plainResumeStartedAt=0;
      ui.lyrics.classList.remove('manual-dragging');
      ui.lyrics.classList.remove('plain-scrolling');
    }

    function lyricsDragBounds() {
      const nodes=ui.lyrics.children;
      const first=nodes[0],last=nodes[nodes.length-1];
      if(!first||!last)return {min:0,max:0};
      const center=lyricFocusY();
      const firstTarget=center-first.offsetTop-first.offsetHeight*.5;
      const lastTarget=center-last.offsetTop-last.offsetHeight*.5;
      return {min:Math.min(firstTarget,lastTarget),max:Math.max(firstTarget,lastTarget)};
    }

    function isPlainLyrics() {
      return !!(playback.lyrics.length&&playback.lyrics[0].plain);
    }

    function plainPlaybackProgress() {
      if(!isPlainLyrics()||playback.durationMs<=0)return 0;
      return Math.max(0,Math.min(1,(currentPosition()/playback.durationMs-.025)/.95));
    }

    function plainPlaybackIndex() {
      if(!isPlainLyrics())return Math.max(0,playback.active);
      return Math.max(0,Math.min(playback.lyrics.length-1,
        Math.floor(plainPlaybackProgress()*playback.lyrics.length)));
    }

    function plainScrollTarget() {
      const bounds=lyricsDragBounds();
      return bounds.max+(bounds.min-bounds.max)*plainPlaybackProgress();
    }

    function updatePlainLyricsScroll(immediate=false) {
      if(!isPlainLyrics()||manualLyricsScroll)return;
      let target=plainScrollTarget();
      if(plainResumeStartedAt&&!immediate){
        const progress=Math.min(1,(performance.now()-plainResumeStartedAt)/1100);
        const eased=1-Math.pow(1-progress,3);
        target=plainResumeFrom+(target-plainResumeFrom)*eased;
        if(progress>=1)plainResumeStartedAt=0;
      }
      ui.lyrics.classList.add('plain-scrolling');
      setLyricsTranslate(target);
      const progress=plainPlaybackProgress();
      const scaled=progress*playback.lyrics.length;
      const index=Math.max(0,Math.min(playback.lyrics.length-1,Math.floor(scaled)));
      const line=playback.lyrics[index];
      const rate=playback.state==='playing'&&playback.speed>0?playback.speed:1;
      const lineBudget=playback.durationMs>0
        ? Math.max(.1,(1-(scaled-index))*playback.durationMs/playback.lyrics.length/1000/rate)
        : 0;
      const supplement=compactSupplement(line);
      const hasTranslation=!!supplement;
      setCompactLyric(
        linePrimaryText(line),
        document.body.classList.contains('compact'),
        hasTranslation?supplement:(playback.lyrics[index+1]?linePrimaryText(playback.lyrics[index+1]):''),
        lineBudget,
        line,
        hasTranslation
      );
      maybePrefetchSupplement();
    }

    function resumePlainLyrics(animate=true) {
      clearTimeout(manualReturnTimer);
      if(lyricMomentumFrame)cancelAnimationFrame(lyricMomentumFrame);
      manualReturnTimer=0;
      lyricMomentumFrame=0;
      lyricVelocity=0;
      lyricTouchActive=false;
      lyricTouchMoved=false;
      manualLyricsScroll=false;
      ui.lyrics.classList.remove('manual-dragging');
      plainResumeFrom=lyricsTranslateY;
      plainResumeStartedAt=animate?performance.now():0;
      updatePlainLyricsScroll(!animate);
    }

    function resumeRealtimeLyrics(animate=true) {
      if(isPlainLyrics()){
        resumePlainLyrics(animate);
        return;
      }
      resetManualLyricsScroll();
      if(!animate)ui.lyrics.classList.add('manual-dragging');
      updateActiveLine(lyricPosition(),true);
      updateWordProgress(lyricPosition());
      if(!animate)requestAnimationFrame(()=>ui.lyrics.classList.remove('manual-dragging'));
    }

    function lyricFocusY() {
      const height=ui.viewport.clientHeight;
      if(document.body.classList.contains('horizontal-layout'))return height*.48;
      const active=ui.lyrics.children[playback.active];
      const lineHeight=active?active.offsetHeight:54*lyricFontScale;
      const roomy=Math.max(0,Math.min(1,(height-lineHeight*2)/(lineHeight*4)));
      const focus=height*(.455-.17*roomy);
      return Math.min(height*.5,Math.max(focus,lineHeight*.5+8));
    }

    function scheduleRealtimeLyricsReturn() {
      clearTimeout(manualReturnTimer);
      manualReturnTimer=setTimeout(()=>resumeRealtimeLyrics(true),4200);
    }

    function startLyricsMomentum(initialVelocity) {
      if(lyricMomentumFrame)cancelAnimationFrame(lyricMomentumFrame);
      let velocity=Math.max(-2.6,Math.min(2.6,initialVelocity));
      let previous=performance.now();
      ui.lyrics.classList.add('manual-dragging');
      const step=now=>{
        lyricMomentumFrame=0;
        const elapsed=Math.min(34,Math.max(1,now-previous));
        previous=now;
        velocity*=Math.pow(.94,elapsed/16.67);
        const bounds=lyricsDragBounds();
        const proposed=lyricsTranslateY+velocity*elapsed;
        const next=Math.max(bounds.min,Math.min(bounds.max,proposed));
        setLyricsTranslate(next);
        if(next!==proposed)velocity=0;
        if(Math.abs(velocity)>.018){
          lyricMomentumFrame=requestAnimationFrame(step);
        }else{
          ui.lyrics.classList.remove('manual-dragging');
          scheduleRealtimeLyricsReturn();
        }
      };
      lyricMomentumFrame=requestAnimationFrame(step);
    }

    function seekToLyricNode(node) {
      if(!playback.canSeek||!node||!window.LobstaNativeLyrics||!window.LobstaNativeLyrics.mediaSeek)return false;
      const index=Number(node.dataset.i);
      const line=playback.lyrics[index];
      if(!Number.isInteger(index)||!line||line.plain||!Number.isFinite(Number(line.t)))return false;
      const target=Math.max(0,Number(line.t)-Number(playback.lyricOffsetMs||0));
      if(!performMediaSeek(target))return false;
      return true;
    }

    function performMediaSeek(target) {
      if(!playback.canSeek||!window.LobstaNativeLyrics||!window.LobstaNativeLyrics.mediaSeek)return false;
      const normalized=Math.max(0,playback.durationMs>0?Math.min(playback.durationMs,Number(target)||0):Number(target)||0);
      try{window.LobstaNativeLyrics.mediaSeek(normalized);}catch(_){return false;}
      playback.positionMs=normalized;
      playback.receivedAt=performance.now();
      playback.active=-1;
      resumeRealtimeLyrics(false);
      requestSupplement();
      return true;
    }

    function previewProgressSeek(clientX) {
      const rect=ui.progressShell.getBoundingClientRect();
      if(!rect.width||playback.durationMs<=0)return;
      const ratio=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
      progressSeekTarget=playback.durationMs*ratio;
      ui.current.textContent=formatTime(progressSeekTarget);
      ui.progress.style.width=(ratio*100)+'%';
    }

    ui.progressShell.addEventListener('touchstart',event=>{
      if(!playback.canSeek||playback.durationMs<=0||event.touches.length!==1)return;
      progressSeeking=true;
      ui.progressShell.classList.add('seeking');
      previewProgressSeek(event.touches[0].clientX);
      event.preventDefault();
      event.stopPropagation();
    },{passive:false});
    ui.progressShell.addEventListener('touchmove',event=>{
      if(!progressSeeking||event.touches.length!==1)return;
      previewProgressSeek(event.touches[0].clientX);
      event.preventDefault();
      event.stopPropagation();
    },{passive:false});
    ui.progressShell.addEventListener('touchend',event=>{
      if(!progressSeeking)return;
      progressSeeking=false;
      ui.progressShell.classList.remove('seeking');
      performMediaSeek(progressSeekTarget);
      event.preventDefault();
      event.stopPropagation();
    },{passive:false});
    ui.progressShell.addEventListener('touchcancel',()=>{
      progressSeeking=false;
      ui.progressShell.classList.remove('seeking');
    },{passive:true});

    ui.viewport.addEventListener('touchstart',event=>{
      if(document.body.classList.contains('compact')||!playback.lyrics.length||event.touches.length!==1)return;
      clearTimeout(manualReturnTimer);
      if(lyricMomentumFrame)cancelAnimationFrame(lyricMomentumFrame);
      lyricMomentumFrame=0;
      lyricTouchActive=true;
      lyricTouchMoved=false;
      manualLyricsScroll=true;
      lyricTouchStartY=event.touches[0].clientY;
      lyricTouchStartTranslate=lyricsTranslateY;
      lyricTouchLastY=lyricTouchStartY;
      lyricTouchLastAt=performance.now();
      lyricVelocity=0;
      ui.lyrics.classList.add('manual-dragging');
    },{passive:true});

    ui.viewport.addEventListener('touchmove',event=>{
      if(!lyricTouchActive||event.touches.length!==1)return;
      const delta=event.touches[0].clientY-lyricTouchStartY;
      if(Math.abs(delta)>8)lyricTouchMoved=true;
      const now=performance.now();
      const elapsed=Math.max(1,now-lyricTouchLastAt);
      const instantVelocity=(event.touches[0].clientY-lyricTouchLastY)/elapsed;
      lyricVelocity=lyricVelocity*.62+instantVelocity*.38;
      lyricTouchLastY=event.touches[0].clientY;
      lyricTouchLastAt=now;
      const bounds=lyricsDragBounds();
      setLyricsTranslate(Math.max(bounds.min,Math.min(bounds.max,lyricTouchStartTranslate+delta)));
      event.preventDefault();
    },{passive:false});

    ui.viewport.addEventListener('touchend',event=>{
      if(!lyricTouchActive)return;
      lyricTouchActive=false;
      if(lyricTouchMoved&&Math.abs(lyricVelocity)>.08){
        startLyricsMomentum(lyricVelocity);
      }else{
        ui.lyrics.classList.remove('manual-dragging');
        if(lyricTouchMoved)scheduleRealtimeLyricsReturn();
        else if(!seekToLyricNode(event.target.closest&&event.target.closest('.line')))resumeRealtimeLyrics(true);
      }
    },{passive:true});

    ui.viewport.addEventListener('touchcancel',()=>{
      if(!lyricTouchActive)return;
      lyricTouchActive=false;
      ui.lyrics.classList.remove('manual-dragging');
      scheduleRealtimeLyricsReturn();
    },{passive:true});

    function updateActiveLine(position, force) {
      const lines = playback.lyrics;
      if (!lines.length) return;
      let index = 0;
      if (lines[0].plain) {
        index = 0;
      } else {
        let low = 0, high = lines.length - 1;
        while (low <= high) {
          const mid = (low + high) >> 1;
          if (lines[mid].t <= position + 90) { index = mid; low = mid + 1; }
          else high = mid - 1;
        }
      }
      if (!force && index === playback.active) return;
      playback.active = index;
      maybePrefetchSupplement();
      const nodes = ui.lyrics.children;
      for (let i = 0; i < nodes.length; i++) {
        nodes[i].classList.toggle('active', i === index);
        nodes[i].classList.toggle('near', Math.abs(i - index) === 1);
        nodes[i].classList.toggle('past', i < index);
      }
      const active = nodes[index];
      if (active) {
        if(lines[index].plain){
          updatePlainLyricsScroll(force);
        }else{
          ui.lyrics.classList.remove('plain-scrolling');
          const target = lyricFocusY() - active.offsetTop - active.offsetHeight * .5;
          if(!manualLyricsScroll)setLyricsTranslate(target);
        }
        const playbackRate = playback.state === 'playing' && playback.speed > 0 ? playback.speed : 1;
        const lineEnd = lines[index + 1]
          ? lines[index + 1].t
          : (playback.durationMs > lines[index].t ? playback.durationMs : 0);
        const currentTimeBudget = !lines[index].plain && lineEnd > position
          ? (lineEnd - position) / 1000 / playbackRate
          : 0;
        const supplement=compactSupplement(lines[index]);
        const compactHasTranslation=!!supplement;
        const compactSecondary=compactHasTranslation
          ? supplement
          : (lines[index + 1] ? linePrimaryText(lines[index + 1]) : '');
        setCompactLyric(
          linePrimaryText(lines[index]),
          !force && document.body.classList.contains('compact'),
          compactSecondary,
          currentTimeBudget,
          lines[index],
          compactHasTranslation
        );
      }
    }

    function updateWordProgress(position) {
      const line=playback.lyrics[playback.active];
      if(!line||!Array.isArray(line.words)||translationMode==='translated')return;
      if(document.body.classList.contains('compact')){
        updateCompactWordProgress(line,position);
        return;
      }
      const node=ui.lyrics.children[playback.active];
      if(!node)return;
      const spans=node.querySelectorAll('.word');
      line.words.forEach((word,index)=>{
        const span=spans[index];
        if(!span)return;
        const duration=Math.max(1,Number(word.duration)||1);
        const progress=Math.max(0,Math.min(1,(position-Number(word.start||0))/duration));
        const fill=progress<=0?'0%':progress>=1?'100%':(progress*100).toFixed(1)+'%';
        if(span.dataset.wordFill!==fill){
          span.dataset.wordFill=fill;
          span.style.setProperty('--word-fill',fill);
        }
      });
    }

    function updateCompactWordProgress(line,position) {
      const viewport=ui.compactLyric.querySelector('.compact-line.current .compact-line-text[data-word-timed="1"]');
      const content=viewport&&viewport.querySelector('.compact-scroll-text');
      if(!viewport||!content||!viewport.clientWidth)return;
      const followKey=String(line.t)+'\u0000'+line.text;
      const viewportWidth=viewport.clientWidth;
      const contentWidth=content.scrollWidth;
      viewport.classList.toggle('is-overflowing',contentWidth>viewportWidth+4);
      const layoutChanged=Math.abs(compactWordFollow.width-viewportWidth)>1||
        Math.abs(compactWordFollow.contentWidth-contentWidth)>1;
      if(compactWordFollow.key!==followKey||layoutChanged){
        compactWordFollow.key=followKey;
        compactWordFollow.shift=0;
        compactWordFollow.target=0;
        compactWordFollow.position=position;
        compactWordFollow.lastAt=performance.now();
        compactWordFollow.width=viewportWidth;
        compactWordFollow.contentWidth=contentWidth;
      }else if(position+800<compactWordFollow.position){
        // A substantial rewind is a real seek. Small MediaSession corrections stay monotonic.
        compactWordFollow.shift=0;
        compactWordFollow.target=0;
        compactWordFollow.position=position;
      }else{
        compactWordFollow.position=Math.max(compactWordFollow.position,position);
      }
      const smoothPosition=compactWordFollow.position;
      const spans=content.querySelectorAll('.compact-word');
      let activeIndex=0;
      line.words.forEach((word,index)=>{
        const span=spans[index];
        if(!span)return;
        const start=Number(word.start||0);
        const duration=Math.max(1,Number(word.duration)||1);
        const progress=Math.max(0,Math.min(1,(smoothPosition-start)/duration));
        const fill=progress<=0?'0%':progress>=1?'100%':(progress*100).toFixed(1)+'%';
        if(span.dataset.wordFill!==fill){
          span.dataset.wordFill=fill;
          span.style.setProperty('--word-fill',fill);
        }
        if(start<=smoothPosition)activeIndex=index;
      });
      const activeWord=line.words[activeIndex];
      const activeSpan=spans[activeIndex];
      if(!activeWord||!activeSpan)return;
      const start=Number(activeWord.start||0);
      const duration=Math.max(1,Number(activeWord.duration)||1);
      const progress=Math.max(0,Math.min(1,(smoothPosition-start)/duration));
      const trackingPoint=activeSpan.offsetLeft+activeSpan.offsetWidth*progress;
      const minimumShift=Math.min(0,viewportWidth-contentWidth-6);
      const desired=Math.max(minimumShift,Math.min(0,viewportWidth*.38-trackingPoint));
      compactWordFollow.target=Math.min(compactWordFollow.target,desired);
      const now=performance.now();
      const elapsed=Math.min(40,Math.max(1,now-compactWordFollow.lastAt));
      compactWordFollow.lastAt=now;
      const smoothing=1-Math.exp(-elapsed/95);
      compactWordFollow.shift+=(compactWordFollow.target-compactWordFollow.shift)*smoothing;
      if(Math.abs(compactWordFollow.target-compactWordFollow.shift)<.08){
        compactWordFollow.shift=compactWordFollow.target;
      }
      content.style.transform='translate3d('+compactWordFollow.shift.toFixed(2)+'px,0,0)';
    }

    function cachedLyrics(key) {
      try {
        const raw = localStorage.getItem('lobsta-lyrics:' + hash(key));
        if (!raw) return null;
        const value = JSON.parse(raw);
        if (value.schema !== LYRICS_CACHE_SCHEMA) return null;
        if (Date.now() - value.savedAt > 14 * 86400000) return null;
        return value;
      } catch (_) { return null; }
    }

    function saveLyrics(key, value) {
      try {
        localStorage.setItem('lobsta-lyrics:' + hash(key), JSON.stringify({
          schema:LYRICS_CACHE_SCHEMA,
          lyrics:isUsableLyricPayload(value.lyrics)?value.lyrics:'',
          translatedLyrics:isUsableLyricPayload(value.translatedLyrics)?value.translatedLyrics:'',
          romanizedLyrics:isUsableLyricPayload(value.romanizedLyrics)?value.romanizedLyrics:'',
          wordLyrics:isUsableLyricPayload(value.wordLyrics)?value.wordLyrics:'',
          duration:Number(value.duration || 0), cover:value.cover || '', source:value.source || '',
          alternatives:Array.isArray(value.alternatives)?value.alternatives.slice(0,3):[],
          lossless:!!value.lossless, hiResLossless:!!value.hiResLossless,
          dolbyAtmos:!!value.dolbyAtmos, savedAt:Date.now()
        }));
      } catch (_) {}
    }

    function hash(input) {
      let h = 2166136261;
      for (let i=0; i<input.length; i++) { h ^= input.charCodeAt(i); h = Math.imul(h,16777619); }
      return (h >>> 0).toString(36);
    }

    function isUsableLyricPayload(value) {
      if(typeof value!=='string')return false;
      const normalized=value.trim().toLowerCase();
      return !!normalized&&normalized!=='null'&&normalized!=='undefined';
    }

    function lyricsCandidateSignature(candidates) {
      return candidates.map(candidate=>[
        candidate.source||'',candidate.lyrics||'',candidate.translatedLyrics||'',candidate.wordLyrics||'',candidate.romanizedLyrics||''
      ].join('\u0000')).join('\u0001');
    }

    async function fetchFallback(track, artist, signal) {
      const url = 'https://lrclib.net/api/search?track_name=' + encodeURIComponent(track) + '&artist_name=' + encodeURIComponent(artist);
      const response = await fetch(url, { signal, headers:{'Accept':'application/json'} });
      if (!response.ok) throw new Error('LRCLIB ' + response.status);
      const list = await response.json();
      if (!Array.isArray(list) || !list.length) return {};
      const match = list.find(item => isUsableLyricPayload(item.syncedLyrics)) ||
        list.find(item => isUsableLyricPayload(item.plainLyrics));
      if(!match)return {};
      return {
        lyrics:isUsableLyricPayload(match.syncedLyrics)?match.syncedLyrics:match.plainLyrics,
        duration:Number(match.duration || 0) * 1000,
        source:'LRCLIB'
      };
    }

    async function resolveTrack(track, artist, key, requestId) {
      const cached = cachedLyrics(key);
      if (cached) applyResolved(cached, key, requestId);
      playback.abort?.abort();
      const controller = new AbortController();
      playback.abort = controller;

      if (window.LobstaNativeLyrics && window.LobstaNativeLyrics.requestLyrics) {
        try {
          window.LobstaNativeLyrics.requestLyrics(
            track,
            artist,
            playback.album||'',
            playback.durationMs||0,
            requestId,
            !playback.coverIsNative
          );
          return;
        } catch (_) {}
      }

      try {
        const data = await fetchFallback(track,artist,controller.signal);
        if (key !== playback.key || requestId !== playback.requestId) return;
        if (isUsableLyricPayload(data.lyrics)) {
          saveLyrics(key,data);
          applyResolved(data,key,requestId);
        } else if (!cached) renderLyrics([], '暂未匹配到歌词');
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        if (!cached && key === playback.key) renderLyrics([], '歌词网络暂不可用');
      }
    }

    function receiveLyrics(requestId, data) {
      if (requestId !== playback.requestId || !playback.key) return;
      if (data && isUsableLyricPayload(data.lyrics)) {
        // A transient rich-lyrics failure must not erase verified words for the same recording.
        const prior=cachedLyrics(playback.key);
        if(Array.isArray(data.alternatives)&&prior){
          const previous=prior.alternatives||[];
          data.alternatives=data.alternatives.map(c=>{
            const old=previous.find(x=>x.source===c.source&&x.recordId&&x.recordId===c.recordId);
            if(!old)return c;
            const retained=completeWordLyrics(old,parseLrc(old.lyrics)).length&&!completeWordLyrics(c,parseLrc(c.lyrics)).length?old:c;
            return {...retained,romanizedLyrics:c.romanizedLyrics||old.romanizedLyrics||''};
          });
        }
        saveLyrics(playback.key, data);
        applyResolved(data, playback.key, requestId);
      } else if (!cachedLyrics(playback.key)) {
        renderLyrics([], '暂未匹配到歌词');
      }
    }

    function receiveRemoteCover(requestId, cover) {
      if (requestId !== playback.requestId || !cover || playback.coverIsNative) return;
      setCover(cover, false);
      const cached = cachedLyrics(playback.key);
      if (cached) {
        cached.cover = cover;
        saveLyrics(playback.key, cached);
      }
    }

    function completeWordLyrics(data,lines) {
      const words=parseWordLyrics(data.wordLyrics);
      const base=lines.length?lines:plainLyrics(data.lyrics);
      const length=rows=>rows.reduce((total,line)=>total+String(line.text||'').replace(/\s/g,'').length,0);
      // Retain the full line/plain track when the word track only contains a title or fragment.
      if(base.length && (words.length<base.length*.7 || length(words)<length(base)*.7))return [];
      return words;
    }

    function candidateQuality(data) {
      const lines=parseLrc(data.lyrics);
      const words=completeWordLyrics(data,lines);
      const base=lines.length?lines:plainLyrics(data.lyrics);
      const count=Math.max(1,base.length);
      const wordCoverage=Math.min(1,words.length/count);
      const translated=attachTranslations(lines.length?lines:words,data.translatedLyrics);
      const translationCoverage=Math.min(1,translated.filter(line=>line.translation).length/count);
      const score=Number(data.matchScore)||0;
      return (score>=95?200000:100000)+score*100+
        (translationMode==='original'?wordCoverage*30000:translationCoverage*20000+wordCoverage*10000);
    }

    function preferredCandidateIndex() {
      let best=0;
      playback.candidates.forEach((candidate,index)=>{
        if(candidateQuality(candidate)>candidateQuality(playback.candidates[best]))best=index;
      });
      return best;
    }

    let manualSourceKey='';
    let automaticCandidates=[];
    function applyResolved(data, key, requestId) {
      if (key !== playback.key || requestId !== playback.requestId) return;
      const supplied=Array.isArray(data.alternatives)&&data.alternatives.length?data.alternatives:[data];
      automaticCandidates=supplied.filter(candidate=>candidate&&isUsableLyricPayload(candidate.lyrics));
      const candidates=supplied.filter(candidate=>candidate&&isUsableLyricPayload(candidate.lyrics)).map(candidate=>{
        const remembered=readMatchMemories().find(entry=>entry.key===matchMemoryKey(candidate.source));
        if(!remembered||remembered.needsReview)return candidate;
        const old=remembered.candidate;
        if(old.recordId&&old.recordId===candidate.recordId&&
            completeWordLyrics(candidate,parseLrc(candidate.lyrics)).length>
            completeWordLyrics(old,parseLrc(old.lyrics)).length)return candidate;
        return old;
      });
      const signature=lyricsCandidateSignature(candidates);
      if(signature&&signature===candidateSignature&&playback.candidates.length)return;
      candidateSignature=signature;
      const selectedSource=manualSourceKey===key?playback.candidates[playback.candidateIndex]?.source:null;
      playback.candidates=candidates;
      playback.candidateIndex=0;
      const remembered=candidates.findIndex(candidate=>candidate.source===selectedSource);
      applyCandidate(remembered>=0?remembered:preferredCandidateIndex());
    }

    function applyCandidate(index) {
      if(!playback.candidates.length){renderLyrics([],'暂未匹配到歌词');return;}
      const normalized=((Number(index)||0)%playback.candidates.length+playback.candidates.length)%playback.candidates.length;
      playback.candidateIndex=normalized;
      const data=playback.candidates[normalized];
